  # All regional development agencies merged into ONE portfolio (2026-07-06).
  # They appear as standalone ministries in some years and as organizations
  # nested inside host ministries (ISED/ISI, Industry, Privy Council, Global
  # Affairs, Health) in others; the organization_overrides section below
  # follows them across hosts. Known gaps, both documented in NOTES.md:
  #   - FedNor is delivered inside the Department of Industry itself and
  #     cannot be separated from Vol II data.
  #   - 2016–2018 Vol II has no organization breakdown at all, so RDA
  #     spending stays inside the ISED portfolio for those years and this
  #     slug has no page there.
  # aggregate: true suppresses the reportedAs banner (a synthetic grouping
  # has no single historical name; the prose names the constituent agencies).
  - slug: regional-economic-development
    existing_page: false
    aggregate: true
    name_en: Regional Economic Development Agencies
    name_fr: Agences de développement régional
    ministries:
      - Atlantic Canada Opportunities Agency
      - Economic Development Agency of Canada for the Regions of Quebec
      - Western Economic Diversification
      - Prairies and Canadian Northern Economic Development
      - Canadian Northern Economic Development Agency
    codes: [apeca-acoa, adrq-edrq, dec-ced, derq-edrq, deo-wd, deo-wed, poean-cannor]

  - slug: parks-canada
    existing_page: false
    name_en: Parks Canada
    name_fr: Parcs Canada
    ministries:
      - Parks Canada
    codes: [pc]

# Organizations that must resolve to a portfolio regardless of which host
# ministry reports them in a given year (highest precedence). Currently the
# regional development agencies, whose host portfolio varies by year.
organization_overrides:
  # SSC belongs to the Public Services and Procurement portfolio in every
  # edition; this also corrects the 2020–2021 gn-dg mislabel (see overrides).
  - organization: Shared Services Canada
    slug: public-services-and-procurement-canada
  - organization: Atlantic Canada Opportunities Agency
    slug: regional-economic-development
  - organization: Economic Development Agency of Canada for the Regions of Quebec
    slug: regional-economic-development
  - organization: Department of Western Economic Diversification
    slug: regional-economic-development
  - organization: Pacific Economic Development Agency of Canada
    slug: regional-economic-development
  - organization: Canadian Northern Economic Development Agency
    slug: regional-economic-development
  - organization: Federal Economic Development Agency for Southern Ontario
    slug: regional-economic-development

# Transfer rows have no organization column, so agency transfer payments
# reported under a host ministry are moved by (host ministry + description
# regex, case-insensitive). Applied only in years where the target slug has
# allotment data (2016–2018 Vol II has no org breakdown, so those years' rows
# stay with the host). Patterns are RDA program names verified against
# 2014–2025 data; deliberately NOT matched: APEC Secretariat (Global Affairs),
# Canada 150 Research Chairs (research, not RDA), Territorial Health
# Investment Fund (Health), Northern Ontario Development Program (FedNor,
# inseparable from Industry — see NOTES.md).
transfer_reattributions:
  - slug: regional-economic-development
    host_ministries:
      - Privy Council
      - Innovation, Science and Industry
      - Innovation, Science and Economic Development
      - Industry
      - Global Affairs
      - Health
    description_patterns:
      - Regional Economic Growth through Innovation
      - Growth through Regional Innovation
      - Community Futures
      - Western Diversification Program
      - Women['’]s Enterprise Initiative
      - Southern Ontario (Prosperity|Development)
      - Atlantic Innovation Fund
      - Innovative [Cc]ommunities [Ff]und
      - Business Development Program
      - Quebec Economic Development [Pp]rogram
      - Economic [Dd]evelopment [Ii]nitiative
      - Aboriginal participation in the northern economy
      - Inclusive Diversification and Economic Advancement in the North
      - Northern Indigenous Economic Opportunities
      - Canada 150 [Cc]ommunity [Ii]nfrastructure
      - Canadian Northern Economic Development Agency
      - Federal Economic Development Agency for Southern Ontario
      - Pacific Economic Development Agency

# Standard-object (dmac-meso) dataset portfolio crosswalk. The meso CSVs label
# the ministry portfolio with its Public-Accounts-era wording, which the
# allotment extraction modernized (so the ministries: lists above don't carry
# these variants). Space/comma/footnote artifacts are handled by the meso
# resolver's space-insensitive matching; only genuinely-renamed portfolios need
# an explicit alias here. Verified against dmac-meso-{2014..2025}.
meso_portfolio_aliases:
  - portfolio: Employment and Social Development        # 2014–2015
    slug: employment-and-social-development-canada
  - portfolio: Foreign Affairs, Trade and Development   # 2014–2015 (Global Affairs)
    slug: global-affairs-canada
  - portfolio: Indian Affairs and Northern Development  # 2014–2015
    slug: indigenous-services-and-northern-affairs
  - portfolio: Indigenous and Northern Affairs          # 2016–2018
    slug: indigenous-services-and-northern-affairs
  - portfolio: Office of the Governor                   # 2015 (truncated label)
    slug: governor-general
  - portfolio: Women, Gender Equality                   # 2023 (truncated label)
    slug: women-and-gender-equality

# Rows whose ministry_name_normalized is null or page-title noise
# ("Public Accounts of Canada"). Resolve by ministry_code; the two ambiguous
# codes are additionally pinned by year.
overrides:
  - code: ec
    slug: environment-and-climate-change     # null-name rows, 2014–2015
  - code: mdn-dnd
    slug: national-defence                   # null-name rows, 2014–2015
  - code: justice
    slug: justice                            # null-name rows, 2014–2015
  - code: gg
    slug: governor-general
  - code: bsgg-oggs
    slug: governor-general
  # gn-dg is extraction noise ("Public Accounts of Canada", 2020–2021) that
  # carries ONLY Shared Services Canada rows — SSC sits under spac-pspc in
  # every other year, and Vol II Table 3 (standard objects) confirms the
  # Governor General portfolio is ~$25M those years, not ~$3B. Route to PSPC.
  - code: gn-dg
    slug: public-services-and-procurement-canada
  - code: edip-ewddi
    slug: employment-and-social-development-canada   # noise, 2021–2022
  - code: ic
    years: [2016]
    slug: innovation-science-and-industry    # noise; ic = Industry in 2016
