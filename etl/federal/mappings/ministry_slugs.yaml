# Ministry → site-slug crosswalk for federal Public Accounts data.
#
# Each portfolio entry maps every `ministry_name_normalized` variant (and the
# raw `ministry_code` values) that appears in the extracted Vol II data
# (2013–2025) to a single canonical URL slug. Many-ministries→one-slug is
# supported via the `ministries:` list.
#
# HARD CONSTRAINT: the 14 slugs marked `existing_page: true` are live site
# URLs and must never change.
#
# Matching contract for the export command:
#   0. Match `organization` against `organization_overrides:` (exact, after
#      dash normalization) — highest precedence, follows an agency across
#      whichever host ministry reports it in a given year.
#   1. Match `ministry_name_normalized` against `ministries:` (exact, after
#      normalizing U+2011/U+2013 dashes to "-").
#   2. If the name is null or a known noise value ("Public Accounts of
#      Canada"), fall back to `overrides:` below (code, optionally + year).
#   3. The `consolidated` ministry_code (2013–2014 Vol III pages) is shared
#      across portfolios — always resolve those rows by name, never by code.
#   4. Any row that resolves to no portfolio is an export error.
#
# name_fr values come from the official bilingual open.canada.ca Public
# Accounts CSVs (amo-ame-*.csv) where available; a few were completed from
# official usage where the CSV value was truncated (marked with a comment).

portfolios:
  - slug: department-of-finance
    existing_page: true
    name_en: Finance
    name_fr: Finances
    ministries:
      - Finance
      - inance                # extraction artifact, fin 2020–2021
    codes: [fin]

  - slug: employment-and-social-development-canada
    existing_page: true
    name_en: Employment and Social Development
    name_fr: Emploi et Développement social   # portfolio dept name; CSV ministry label truncated
    ministries:
      - Employment and Workforce Development
      - Employment, Workforce Development and Disability Inclusion
      - Families, Children and Social Development
    codes: [edsc-esdc, edip-ewddi, feds-fcsd, rhdcc-hrsdc]

  # Aggregates BOTH successor ministries of the former Indian Affairs and
  # Northern Development portfolio (split in 2017/2019). The existing site
  # page covers the combined portfolio, so both map to one slug.
  - slug: indigenous-services-and-northern-affairs
    existing_page: true
    name_en: Indigenous Services and Crown-Indigenous Relations
    name_fr: Services aux Autochtones et Relations Couronne-Autochtones
    ministries:
      - Indigenous Services
      - Crown-Indigenous Relations and Northern Affairs
      - Crown-Indigenous Relations
    codes: [sa-is, rcaanc-cirnac, aadnc-aandc, aanc-inac]

  - slug: national-defence
    existing_page: true
    name_en: National Defence
    name_fr: Défense nationale
    ministries:
      - National Defence
    codes: [mdn-dnd]

  - slug: global-affairs-canada
    existing_page: true
    name_en: Global Affairs
    name_fr: Affaires mondiales
    ministries:
      - Global Affairs
    codes: [amc-gac, maeci-dfait]

  # The ministry is "National Revenue" in most years; the CRA is its only
  # organization. Both labels map here.
  - slug: canada-revenue-agency
    existing_page: true
    name_en: National Revenue
    name_fr: Revenu national
    ministries:
      - National Revenue
      - Canada Revenue Agency
    codes: [rn-nr, arc-cra]

  - slug: housing-infrastructure-communities
    existing_page: true
    name_en: Housing, Infrastructure and Communities
    name_fr: Logement, Infrastructures et Collectivités
    ministries:
      - Housing, Infrastructure and Communities
      - Infrastructure and Communities
      - Intergovernmental Affairs, Infrastructure and Communities
      - Infrastructure et Collectivités       # French leak in 2024 extraction
      - Office of Infrastructure of Canada
    codes: [infra, bic-oic]

  - slug: public-safety-canada
    existing_page: true
    name_en: Public Safety
    name_fr: Sécurité publique
    ministries:
      - Public Safety and Emergency Preparedness
      - Public Safety
      - Public Safety, Democratic Institutions and Intergovernmental Affairs
    codes: [sp-ps]

  - slug: health-canada
    existing_page: true
    name_en: Health
    name_fr: Santé
    ministries:
      - Health
    codes: [sc-hc]

  - slug: innovation-science-and-industry
    existing_page: true
    name_en: Innovation, Science and Industry
    name_fr: Innovation, Sciences et Industrie
    ministries:
      - Innovation, Science and Economic Development
      - Innovation, Science and Industry
      - Industry
      - Science
    codes: [isde-ised, isi, sci, ic]   # `ic` = Industry in early years; see overrides + NOTES for the ic collision

  - slug: public-services-and-procurement-canada
    existing_page: true
    name_en: Public Services and Procurement
    name_fr: Services publics et Approvisionnement
    ministries:
      - Public Services and Procurement
      - Public Works and Government Services
    codes: [spac-pspc, tpsgc-pwgsc]

  - slug: immigration-refugees-and-citizenship
    existing_page: true
    name_en: Immigration, Refugees and Citizenship
    name_fr: Immigration, Réfugiés et Citoyenneté
    ministries:
